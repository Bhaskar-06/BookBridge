{% extends 'base.html' %}
{% block title %}My account{% endblock %}
{% block content %}
<div class="page-head"><div class="container"><h1 class="h2 mb-0">My account</h1></div></div>
<div class="container py-4"><div class="row g-4">
  <div class="col-lg-4">
    <div class="card shadow-sm text-center p-4">
      <div class="avatar mx-auto mb-3">{{ user.name[0]|upper }}</div>
      <h2 class="h5 mb-0">{{ user.name }}</h2>
      <p class="text-muted small mb-3">{{ user.email }}</p>
      <div class="row text-center border-top pt-3">
        <div class="col"><div class="h4 mb-0">{{ listed }}</div><small class="text-muted">Listed</small></div>
        <div class="col"><div class="h4 mb-0">{{ sold }}</div><small class="text-muted">Sold</small></div>
      </div>
      <p class="small text-muted mt-3 mb-0">Member since <span data-date="{{ joined }}"></span></p>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card shadow-sm mb-4"><div class="card-body p-4">
      <h2 class="h5 mb-3">Profile details</h2>
      <form action="{{ url_for('profile_update') }}" method="post">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="name">Full name</label>
            <input class="form-control" id="name" name="name" required maxlength="80" value="{{ user.name }}"></div>
          <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
            <input class="form-control" id="phone" name="phone" maxlength="15" value="{{ user.phone or '' }}"></div>
          <div class="col-12"><label class="form-label">Email</label>
            <input class="form-control" value="{{ user.email }}" disabled></div>
        </div>
        <button class="btn btn-primary mt-3" type="submit">Save changes</button>
      </form>
    </div></div>

    <div class="card shadow-sm"><div class="card-body p-4">
      <h2 class="h5 mb-3">Change password</h2>
      <form action="{{ url_for('change_password') }}" method="post">
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="current">Current password</label>
            <input class="form-control" type="password" id="current" name="current" required autocomplete="current-password"></div>
          <div class="col-md-6"><label class="form-label" for="password">New password</label>
            <input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password"></div>
          <div class="col-md-6"><label class="form-label" for="confirm">Confirm new password</label>
            <input class="form-control" type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password"></div>
        </div>
        <button class="btn btn-outline-primary mt-3" type="submit">Update password</button>
      </form>
    </div></div>
  </div>
</div></div>
{% endblock %}
