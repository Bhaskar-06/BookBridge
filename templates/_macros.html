{% macro card(b) %}
<div class="card book-card h-100 shadow-sm">
  <a href="{{ url_for('book_detail', book_id=b.id) }}" class="book-cover">
    {% if b.has_image %}
      <img src="{{ url_for('book_image', book_id=b.id) }}" alt="Cover of {{ b.title }}" loading="lazy">
    {% else %}
      <div class="cover-placeholder"><i class="bi bi-book"></i></div>
    {% endif %}
    {% if b.status == 'sold' %}<span class="badge bg-secondary sold-badge">SOLD</span>{% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <span class="badge bg-light text-dark border align-self-start mb-2">{{ b.category }}</span>
    <h3 class="h6 card-title mb-1 text-truncate-2">
      <a href="{{ url_for('book_detail', book_id=b.id) }}" class="stretched-link text-decoration-none text-dark">{{ b.title }}</a></h3>
    <p class="small text-muted mb-2">by {{ b.author }}</p>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="price">₹{{ b.price }}</span><small class="text-muted">{{ b.condition }}</small>
    </div>
  </div>
</div>
{% endmacro %}
