{% extends 'base.html' %}
{% block title %}Choose a new password{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card shadow-lg">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock-fill auth-logo"></i>
    <h1 class="h3 mt-2 mb-1 brand-dark">Choose a new password</h1>
    <p class="text-muted mb-0">Use at least 6 characters.</p>
  </div>
  {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
  <form method="post" novalidate>
    <div class="mb-3"><label class="form-label" for="password">New password</label>
      <input class="form-control" type="password" id="password" name="password" required minlength="6" autofocus autocomplete="new-password"></div>
    <div class="mb-4"><label class="form-label" for="confirm">Confirm new password</label>
      <input class="form-control" type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password"></div>
    <button class="btn btn-primary w-100 py-2" type="submit">Update password</button>
  </form>
</div></div>
{% endblock %}
